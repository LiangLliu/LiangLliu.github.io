<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞机大战 · 摸鱼小游戏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <h1 class="title">飞机大战</h1>
  <a class="back" href="/games/">← 返回游戏列表</a>
</header>

<div class="hud">
  <div class="hud-item">分数 <span class="num" id="score">0</span></div>
  <div class="hud-item">最高 <span class="num" id="best">0</span></div>
  <div class="hud-item">生命 <span class="num" id="lives">3</span></div>
  <div class="hud-item">等级 <span class="num" id="level">1</span></div>
</div>

<div class="stage">
  <canvas id="game" tabindex="0"></canvas>
  <div id="overlay" class="overlay hidden">
    <div class="ov-title" id="ov-title">已暂停</div>
    <div class="ov-sub" id="ov-sub">按空格继续</div>
  </div>
</div>

<div class="controls">
  <button id="restart" type="button">重新开始</button>
</div>

<p class="hint">方向键 / WASD 移动 · 鼠标或手指拖动跟随 · 空格暂停 · R 重新开始</p>

<script src="game.js"></script>
</body>
</html>
