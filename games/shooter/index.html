<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞机大战 · 摸鱼小游戏</title>
<link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/games/assets/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="app-head">
    <h1 class="app-title"><span>飞</span><span>机</span><span>大</span><span>战</span></h1>
    <a class="back" href="/games/">← 返回游戏列表</a>
  </header>

  <section class="directions"><p><strong>怎么玩：</strong>拖拽或方向键 / WASD 移动飞机，自动开火。击毁敌机得 10 分，分数与时间双轴提升难度，别让敌机撞到或溜过去！</p></section>

  <section class="hud">
    <span class="hud-item hud-best">历史最佳<b id="best">0</b></span>
    <span class="hud-item">分数<b id="score">0</b><span class="float" id="float"></span></span>
    <span class="hud-item">生命<b class="hearts" id="lives" data-lives="3"><i>♥</i><i>♥</i><i>♥</i></b></span>
    <span class="hud-item">等级<b id="level">1</b><span class="float" id="levelFloat"></span></span>
  </section>

  <div class="frame">
    <div class="stage" id="stage">
      <canvas id="game" tabindex="0"></canvas>
      <div class="overlay" id="overlay">
        <span class="overlay-emoji" id="ovEmoji">🙈</span>
        <span class="overlay-title" id="ovTitle">游戏结束</span>
        <span class="overlay-sub" id="ovSub">得分 0</span>
        <button class="btn" id="again">再试一次</button>
      </div>
    </div>
  </div>

  <div class="pad">
    <button type="button" data-dir="left">←</button>
    <button type="button" data-dir="up">↑</button>
    <button type="button" data-dir="down">↓</button>
    <button type="button" data-dir="right">→</button>
    <button type="button" id="pauseBtn">⏸</button>
  </div>

  <div class="actions"><button class="btn" id="restart">重新开始</button></div>

  <p class="hint">方向键 / WASD 移动 · 鼠标或手指拖动跟随 · 空格暂停 · R 重新开始</p>
</main>
<script src="game.js"></script>
</body>
</html>
