<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五子棋 · 摸鱼小游戏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app" tabindex="0" aria-label="五子棋">
  <header class="head">
    <h1>五子棋</h1>
    <a href="/games/">← 返回游戏列表</a>
  </header>

  <div class="hud">
    <span>分数 <b id="score">0</b></span>
    <span>最高分 <b id="best">0</b></span>
  </div>

  <p class="status" id="status" aria-live="polite">轮到你落子（黑）</p>

  <div class="stage">
    <canvas id="board" width="600" height="600" aria-label="十五路五子棋棋盘"></canvas>
  </div>

  <div class="bar">
    <button type="button" id="restart">重新开始</button>
    <button type="button" id="undo">悔棋</button>
  </div>

  <p class="hint">点击 / 触摸棋盘落子 · 方向键移动光标 · 回车或空格落子 · U 悔棋 · R 重新开始</p>
</main>
<script src="game.js" defer></script>
</body>
</html>
