<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贪吃蛇 · 摸鱼小游戏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app" tabindex="0" aria-label="贪吃蛇">
  <header class="head">
    <h1>贪吃蛇</h1>
    <a href="/games/">← 返回游戏列表</a>
  </header>

  <div class="hud">
    <span>分数 <b id="score">0</b></span>
    <span>最高分 <b id="best">0</b></span>
  </div>

  <div class="stage" id="stage">
    <canvas id="board" width="400" height="400"></canvas>
    <p class="notice" id="notice" aria-live="polite">按方向键 / WASD 开始</p>
  </div>

  <div class="bar">
    <button type="button" id="restart">重新开始</button>
    <button type="button" id="pause">暂停</button>
  </div>

  <p class="hint">方向键 / WASD 移动 · 空格暂停 · R 重新开始 · 手机滑动转向</p>
</main>
<script src="game.js" defer></script>
</body>
</html>
